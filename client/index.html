<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rune Kart</title>
    <style>
      /* Dark fantasy HUD: old-book serif, bronze trim, parchment-gold text on dark panels. */
      :root { --gold: #e9d6a0; --bronze: #8a6a3a; --iron: #4a4b53; --bronze-hi: #c9a25e; --panel: #120c18e0; --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #hud { position: fixed; top: 10px; left: 12px; color: var(--gold); font: 15px var(--serif); letter-spacing: .03em; text-shadow: 0 1px 3px #000, 0 0 8px #000; }
      #hud small { color: #bfae86; font-size: 12px; }
      #banner { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); color: var(--gold); font: 600 24px var(--serif); letter-spacing: .06em; text-align: center; text-shadow: 0 2px 8px #000, 0 0 18px #6b3fb5aa; pointer-events: none; }
      #banner p { margin: 0 0 6px; font-variant: small-caps; }
      #banner small { font-size: 15px; font-weight: 400; color: #d8c9a3; }
      #banner .big { font-size: 104px; line-height: 1; color: #f3e3b3; text-shadow: 0 0 24px #a77bff, 0 4px 10px #000; }
      #banner table { margin: 0 auto 8px; border-collapse: collapse; font-size: 18px; background: var(--panel); border: 1px solid var(--bronze); }
      #banner td { padding: 4px 12px; text-align: left; border-bottom: 1px solid #8a6a3a55; }
      #banner tr.me { color: #ffd98a; }
      #banner i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 0 1px #0008; }
      #banner kbd { font: inherit; padding: 0 6px; border: 1px solid var(--bronze-hi); border-radius: 3px; background: #0006; }
      /* Mana orb: dark glass sphere in a bronze frame, glowing liquid that slowly churns, gloss on top. */
      #spells { position: fixed; left: 14px; bottom: 14px; display: flex; align-items: flex-end; gap: 12px; font: 12px var(--serif); color: var(--gold); pointer-events: none; }
      #spells .orb { position: relative; width: 104px; height: 104px; border-radius: 50%; overflow: hidden; background: #07050f;
        border: 5px solid var(--iron); box-shadow: 0 0 0 2px #121117, 0 0 0 4px #6e6f78, inset 0 0 18px #000, 0 6px 16px #000a; }
      #spells .orb .liquid { position: absolute; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 40% 85%, var(--mana-hi, #6f8dff), var(--mana, #2441d6) 45%, var(--mana-lo, #0d1670) 90%); transition: height .15s linear; }
      /* Slow swirl of brighter and darker tones inside the liquid, like Diablo's churning orb. */
      #spells .orb .swirl { position: absolute; inset: 0; overflow: hidden; }
      #spells .orb .swirl::before, #spells .orb .swirl::after { content: ''; position: absolute; inset: -70%; mix-blend-mode: screen; }
      #spells .orb .swirl::before { background: conic-gradient(from 0deg, #0000, #a9bcff38 12%, #0000 28%, #0000 50%, #8fa6ff2e 64%, #0000 80%); animation: orb-swirl 16s linear infinite; }
      #spells .orb .swirl::after { background: radial-gradient(circle at 30% 40%, #c5d2ff2a, #0000 22%), radial-gradient(circle at 70% 65%, #050a4a66, #0000 26%); animation: orb-swirl 23s linear infinite reverse; mix-blend-mode: normal; }
      /* Calm surface: a barely-undulating edge (huge, slowly turning rounded square in the empty colour) and a bright meniscus. */
      #spells .orb .wave { position: absolute; left: 50%; bottom: calc(100% - 3px); width: 260px; height: 260px; margin-left: -130px; border-radius: 47%; background: #07050f; animation: orb-swirl 14s linear infinite; }
      #spells .orb .liquid::before { content: ''; position: absolute; left: 0; right: 0; top: 3px; height: 2px; background: linear-gradient(90deg, #0000, #c3d0ffcc, #0000); z-index: 1; }
      #spells .orb .glass { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 26%, #ffffff55, #ffffff10 22%, transparent 40%), radial-gradient(circle at 50% 120%, transparent 55%, #0008); }
      #spells .orb span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 19px; color: #f2ecff; text-shadow: 0 1px 3px #000, 0 0 8px #000; }
      #spells .orb.full { animation: orb-full 2.4s ease-in-out infinite; }
      #spells .orb.denied { animation: orb-shake .3s; }
      @keyframes orb-swirl { to { transform: rotate(360deg); } }
      @keyframes orb-full { 50% { box-shadow: 0 0 0 2px #121117, 0 0 0 4px #6e6f78, inset 0 0 18px #000, 0 0 14px var(--mana-glow, #4f6bff88); } }
      @keyframes orb-shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

      /* Spell bar: a carved stone plate in an iron rim, tucked under the orb like a Diablo action bar.
         Each spell is a gothic-arched rune socket; castable spells glow up from the base in their colour. */
      #spells .orb { z-index: 1; }
      #spells .bar { position: relative; display: flex; gap: 12px; margin-left: -26px; padding: 12px 16px 6px 34px; border-radius: 4px 12px 12px 4px;
        background-color: #1b1720;
        background-image: radial-gradient(circle at 20% 30%, #ffffff0a 0 1.5px, transparent 2.5px), radial-gradient(circle at 70% 65%, #0000004d 0 2.5px, transparent 3.5px), linear-gradient(#2b2531, #15111a);
        background-size: 23px 19px, 31px 27px, auto;
        box-shadow: inset 0 1px 0 #ffffff14, inset 0 -3px 8px #000c, 0 0 0 2px #121117, 0 0 0 4px var(--iron), 0 0 0 5px #0b0a0e, 0 8px 18px #000b; }
      /* Bronze diamond stud on the bar's end. */
      #spells .bar::after { content: ''; position: absolute; right: -8px; top: 50%; width: 11px; height: 11px; transform: translateY(-50%) rotate(45deg);
        background: linear-gradient(135deg, #e3c27c, #6b4c25); box-shadow: 0 0 0 2px #0b0a0e; }
      #spells .spell { position: relative; display: flex; flex-direction: column; align-items: center; width: 58px; }
      #spells .slot { position: relative; width: 50px; height: 58px; overflow: hidden; border-radius: 25px 25px 5px 5px / 22px 22px 5px 5px;
        background: radial-gradient(ellipse at 50% 30%, #1d1722, #08060b);
        box-shadow: inset 0 4px 9px #000, inset 0 -1px 0 #ffffff12, 0 0 0 2px #2a2830, 0 0 0 3px #57575f; }
      /* The rune's glow, rising from the base of the socket. */
      #spells .slot::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 115%, var(--c), transparent 68%); opacity: 0; transition: opacity .25s; }
      #spells .slot svg { position: relative; display: block; width: 26px; height: 26px; margin: 15px auto 0; fill: none; stroke: var(--c); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .3; filter: saturate(.4); transition: opacity .2s, filter .2s; }
      #spells .slot .cd { position: absolute; inset: 0; display: grid; place-items: center; background: conic-gradient(#000c calc(var(--cd, 0) * 360deg), transparent 0); font-size: 14px; font-weight: 700; color: #e8dcc0; text-shadow: 0 0 4px #000; }
      /* Bronze key plaque on the arch's crown, and a mana gem with the cost at its foot. */
      #spells .spell kbd { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); padding: 0 5px; border-radius: 2px; font: 700 9px/13px var(--serif);
        color: #1a1008; background: linear-gradient(#d9b46c, #7a5a2e); box-shadow: 0 0 0 1px #0b0a0e; z-index: 1; }
      #spells .spell .cost { position: absolute; top: 47px; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; display: grid; place-items: center; z-index: 1;
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); background: radial-gradient(circle at 40% 35%, #b8c8ff, #2f4ed8 60%, #13207a); font: 700 9px var(--serif); color: #fff; text-shadow: 0 1px 1px #000; }
      #spells .spell b { margin-top: 13px; font-size: 11px; line-height: 1; font-variant: small-caps; letter-spacing: .06em; color: #8f7f5c; text-shadow: 0 -1px 0 #000, 0 1px 0 #ffffff14; }
      /* Ready: a tarnished-bronze ring touched with the rune's colour, a low glow in the socket, and the rune
         itself engraved and faintly lit — candlelight on an inlaid stone, not neon. */
      #spells .spell.ready .slot { box-shadow: inset 0 4px 9px #000, 0 0 0 2px #2a2830, 0 0 0 3px color-mix(in srgb, var(--c) 35%, var(--bronze-hi)), 0 0 6px color-mix(in srgb, var(--c) 22%, transparent); }
      #spells .spell.ready .slot::before { opacity: .28; }
      #spells .spell.ready svg { opacity: 1; stroke: color-mix(in srgb, var(--c) 75%, var(--gold)); filter: drop-shadow(0 1px 0 #000) drop-shadow(0 0 2px color-mix(in srgb, var(--c) 40%, transparent)); }
      #spells .spell.ready b { color: var(--gold); }
      /* Can't afford it: the gem goes dark red. */
      #spells .spell.poor .cost { background: radial-gradient(circle at 40% 35%, #ff9a9a, #9c1f1f 60%, #3a0808); }
      #spells .spell.denied .slot { animation: slot-denied .35s; }
      @keyframes slot-denied { 0%, 60% { box-shadow: inset 0 4px 9px #000, 0 0 0 2px #2a2830, 0 0 0 3px #ff4040, 0 0 14px #ff4040aa; } }
      /* Minimap: a dark stone tablet in an iron frame, top right. */
      #minimap { position: fixed; top: 12px; right: 12px; width: 168px; height: 168px; border-radius: 8px; pointer-events: none;
        background: radial-gradient(circle at 50% 40%, #241e2acc, #0e0b12e6);
        box-shadow: inset 0 0 14px #000, 0 0 0 2px #121117, 0 0 0 4px var(--iron), 0 0 0 5px #0b0a0e, 0 6px 16px #000a; }
      /* Placing, bottom right: big metal numerals — gold, silver, bronze, then iron. */
      #place { position: fixed; right: 20px; bottom: 8px; font: 700 76px/1 var(--serif); pointer-events: none; filter: drop-shadow(0 3px 0 #000a) drop-shadow(0 0 12px #000); }
      #place small { font-size: 30px; margin-left: 2px; }
      #place, #place small { background-clip: text; -webkit-background-clip: text; color: transparent; }
      #place.p1, #place.p1 small { background-image: linear-gradient(#fff4c4, #e8b64c 55%, #8a5a1a); }
      #place.p2, #place.p2 small { background-image: linear-gradient(#ffffff, #b9bec9 55%, #5d6270); }
      #place.p3, #place.p3 small { background-image: linear-gradient(#ffd8b0, #c27a3e 55%, #6b3a14); }
      #place.p4, #place.p4 small { background-image: linear-gradient(#d6d6de, #74757e 55%, #34353b); }
      #place.pop { animation: place-pop .35s ease-out; }
      @keyframes place-pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
      /* Lap banner: sweeps in, holds, sweeps out. Final lap burns orange. */
      #lapflash { position: fixed; top: 32%; left: 0; right: 0; text-align: center; font: 700 64px var(--serif); font-variant: small-caps; letter-spacing: .04em;
        color: #f3e3b3; text-shadow: 0 0 24px #a77bff, 0 4px 10px #000; opacity: 0; pointer-events: none; }
      #lapflash small { font-size: 34px; color: #d8c9a3; }
      #lapflash.show { animation: lap-sweep 2.2s ease forwards; }
      #lapflash.final { color: #ffcf7a; font-size: 76px; text-shadow: 0 0 24px #ff7a2a, 0 0 48px #ff3d1a88, 0 4px 10px #000; }
      #wrongway { position: fixed; top: 20%; left: 0; right: 0; text-align: center; font: 700 56px var(--serif); font-variant: small-caps; letter-spacing: .06em;
        color: #ff7a66; text-shadow: 0 0 22px #ff2a1a, 0 4px 10px #000; opacity: 0; visibility: hidden; pointer-events: none; }
      #wrongway.on { visibility: visible; animation: wrong-blink 0.9s steps(1) infinite; }
      @keyframes wrong-blink { 0% { opacity: 1; } 55% { opacity: 0.2; } }
      @keyframes lap-sweep { 0% { transform: translateX(60vw); opacity: 0; } 15%, 75% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(-60vw); opacity: 0; } }
      /* Lobby panel (inside the banner). */
      #banner .lobby { min-width: 300px; padding: 14px 20px 12px; background: var(--panel); border-radius: 6px; box-shadow: 0 0 0 2px #121117, 0 0 0 4px var(--iron), 0 8px 24px #000c; }
      #banner .lobby ul { list-style: none; margin: 6px 0 10px; padding: 0; text-align: left; font-size: 16px; font-weight: 400; }
      #banner .lobby li { display: flex; align-items: center; gap: 4px; padding: 3px 0; border-bottom: 1px solid #ffffff10; }
      #banner .lobby li.me { color: #ffd98a; }
      #banner .lobby li em { font-size: 12px; color: #9a8d72; }
      #banner .lobby .tick { margin-left: auto; color: #7dffb0; }
      #banner .lobby .prompt { font-size: 18px; margin: 6px 0; }
      #banner .lobby .code { font-family: ui-monospace, monospace; letter-spacing: .08em; color: #f3e3b3; user-select: all; pointer-events: auto; }

      /* Main menu: a dark tome on the left over a slow orbit of the selected track. */
      body.in-menu #hud, body.in-menu #spells, body.in-menu #minimap, body.in-menu #place, body.in-menu #lapflash, body.in-menu #banner { display: none; }
      .menu-bg { position: fixed; inset: 0; z-index: 0; }
      #menu { position: fixed; inset: 0; z-index: 1; display: flex; align-items: center; padding: 24px 48px; background: linear-gradient(90deg, #07050cee 0, #07050cb0 38%, #07050c00 70%); color: var(--gold); font-family: var(--serif); overflow-y: auto; }
      #menu .panel { width: min(440px, 100%); }
      #menu h1 { margin: 0; font-size: 64px; font-variant: small-caps; letter-spacing: .06em; color: #f3e3b3; text-shadow: 0 0 28px #a77bffaa, 0 4px 12px #000; }
      #menu h2 { margin: 0 0 16px; font-size: 32px; font-variant: small-caps; letter-spacing: .05em; color: #f3e3b3; text-shadow: 0 0 18px #a77bff88; }
      #menu .tag { margin: 2px 0 22px; color: #b9a982; font-style: italic; }
      #menu button { font: inherit; color: var(--gold); cursor: pointer; border: 0; border-radius: 5px; background: linear-gradient(#2a2430, #16121b); box-shadow: inset 0 1px 0 #ffffff12, 0 0 0 2px #121117, 0 0 0 3px var(--iron); padding: 10px 16px; text-align: left; transition: box-shadow .15s, transform .15s; }
      #menu button:hover, #menu button:focus-visible { outline: none; box-shadow: inset 0 1px 0 #ffffff12, 0 0 0 2px #121117, 0 0 0 3px #a77bff, 0 0 14px #a77bff66; transform: translateX(3px); }
      #menu button.primary { background: linear-gradient(#3b2a58, #1e1430); }
      #menu button small { display: block; font-size: 13px; color: #a9997a; margin-top: 2px; }
      #menu nav { display: grid; gap: 12px; }
      #menu nav button { font-size: 21px; font-variant: small-caps; letter-spacing: .04em; }
      #menu .name { display: grid; gap: 6px; margin-bottom: 20px; font-size: 14px; color: #b9a982; }
      #menu input { font: 18px var(--serif); color: #f3e3b3; background: #0b0910cc; border: 0; border-radius: 4px; padding: 9px 12px; box-shadow: inset 0 2px 6px #000, 0 0 0 1px #57575f; }
      #menu input:focus { outline: none; box-shadow: inset 0 2px 6px #000, 0 0 0 2px #a77bff; }
      #menu .tracks { display: grid; gap: 10px; margin-bottom: 16px; }
      #menu .track.on { box-shadow: inset 0 1px 0 #ffffff12, 0 0 0 2px #121117, 0 0 0 3px #e8b64c, 0 0 12px #e8b64c55; }
      #menu .track b { font-size: 19px; font-variant: small-caps; }
      #menu .row { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
      #menu .row > span { min-width: 60px; color: #b9a982; }
      #menu .row .laps { min-width: 24px; text-align: center; font-size: 22px; }
      #menu .row button { padding: 4px 14px; text-align: center; }
      #menu .check { cursor: pointer; color: #cdbb8f; }
      #menu .check input { width: 18px; height: 18px; accent-color: #a77bff; }
      #menu .code input { flex: 1; min-width: 0; text-transform: none; }
      #menu .row input[type=range] { flex: 1; min-width: 0; padding: 0; background: none; box-shadow: none; accent-color: #a77bff; }
      #menu .row output { min-width: 44px; text-align: right; color: #f3e3b3; }
      #menu .row button.on { box-shadow: inset 0 1px 0 #ffffff12, 0 0 0 2px #121117, 0 0 0 3px #e8b64c, 0 0 10px #e8b64c55; }
      #menu .hint { margin: 14px 0 0; font-size: 14px; color: #a9997a; font-style: italic; }
      #menu .lobbies { display: grid; gap: 10px; max-height: 46vh; overflow-y: auto; padding: 4px; }
      #menu .empty { color: #a9997a; font-style: italic; }
      #menu .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
      #menu .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0 0 8px; }
      #menu .keys dt { color: #f3e3b3; font-weight: 700; white-space: nowrap; }
      #menu .keys dd { margin: 0; color: #cdbb8f; }
      @media (max-width: 640px) { #menu { padding: 16px; background: #07050cd9; } #menu h1 { font-size: 46px; } #menu nav button { font-size: 18px; } }
      @media (max-width: 560px) { #minimap { width: 112px; height: 112px; } #place { font-size: 52px; } #place small { font-size: 22px; } #lapflash { font-size: 40px; } #lapflash.final { font-size: 46px; } }
      @media (max-width: 560px) { #spells { gap: 8px; } #spells .orb { width: 76px; height: 76px; } #spells .bar { gap: 6px; padding-right: 10px; } #spells .spell { width: 46px; } #spells .slot { width: 42px; height: 50px; } #spells .slot svg { width: 22px; height: 22px; margin-top: 12px; } #spells .spell .cost { top: 39px; } #spells .spell b { font-size: 10px; } }
    </style>
  </head>
  <body>
    <div id="hud" role="status">Connecting…</div>
    <div id="banner" aria-live="polite"></div>
    <div id="spells"></div>
    <canvas id="minimap" aria-label="Track map"></canvas>
    <div id="place" aria-live="polite"></div>
    <div id="lapflash" aria-live="polite"></div>
    <div id="wrongway" role="status" aria-live="polite">Wrong Way</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
