<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rune Kart</title>
    <style>
      /* Dark fantasy HUD: old-book serif, bronze trim, parchment-gold text on dark panels. */
      :root { --gold: #e9d6a0; --bronze: #8a6a3a; --bronze-hi: #c9a25e; --panel: #120c18e0; --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #hud { position: fixed; top: 10px; left: 12px; color: var(--gold); font: 15px var(--serif); letter-spacing: .03em; text-shadow: 0 1px 3px #000, 0 0 8px #000; }
      #hud small { color: #bfae86; font-size: 12px; }
      #banner { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); color: var(--gold); font: 600 24px var(--serif); letter-spacing: .06em; text-align: center; text-shadow: 0 2px 8px #000, 0 0 18px #6b3fb5aa; pointer-events: none; }
      #banner p { margin: 0 0 6px; font-variant: small-caps; }
      #banner small { font-size: 15px; font-weight: 400; color: #d8c9a3; }
      #banner .big { font-size: 104px; line-height: 1; color: #f3e3b3; text-shadow: 0 0 24px #a77bff, 0 4px 10px #000; }
      #banner table { margin: 0 auto 8px; border-collapse: collapse; font-size: 18px; background: var(--panel); border: 1px solid var(--bronze); }
      #banner td { padding: 4px 12px; text-align: left; border-bottom: 1px solid #8a6a3a55; }
      #banner tr.me { color: #ffd98a; }
      #banner i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 0 1px #0008; }
      #banner kbd { font: inherit; padding: 0 6px; border: 1px solid var(--bronze-hi); border-radius: 3px; background: #0006; }
      #spells { position: fixed; left: 12px; bottom: 12px; display: flex; align-items: flex-end; gap: 8px; font: 12px var(--serif); color: var(--gold); pointer-events: none; }
      #spells .orb { position: relative; width: 88px; height: 88px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 40%, #1a1030, #05030c); border: 4px solid var(--bronze); box-shadow: 0 0 0 2px #2a1d10, inset 0 0 12px #000, 0 0 18px #3b55ff55; }
      #spells .orb .fill { position: absolute; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 35% 30%, #9fc0ff, #2d4fe0 50%, #0e1a70); transition: height .1s linear; }
      #spells .orb span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 17px; color: #f2ecff; text-shadow: 0 1px 3px #000; }
      #spells .slot { position: relative; width: 66px; padding: 7px 4px 6px; border-radius: 4px; background: var(--panel); border: 2px solid var(--bronze); box-shadow: inset 0 3px 0 var(--c), 0 0 10px #0008; text-align: center; overflow: hidden; }
      #spells .slot b { display: block; font-size: 11px; line-height: 1.2; font-variant: small-caps; letter-spacing: .04em; }
      #spells .slot small { color: #9fb8ff; }
      #spells .slot kbd { position: absolute; top: 3px; left: 4px; font: 700 10px var(--serif); color: var(--bronze-hi); }
      #spells .slot .cd { position: absolute; left: 0; right: 0; bottom: 0; background: #000c; }
      #spells .slot.off { opacity: .45; }
      @media (max-width: 520px) { #spells .slot { width: 52px; } #spells .orb { width: 66px; height: 66px; } }
    </style>
  </head>
  <body>
    <div id="hud" role="status">Connecting…</div>
    <div id="banner" aria-live="polite"></div>
    <div id="spells"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
