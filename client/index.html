<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rune Kart</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #hud { position: fixed; top: 8px; left: 8px; color: #fff; font: 14px system-ui, sans-serif; text-shadow: 0 1px 2px #000; }
      #banner { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); color: #fff; font: 600 22px system-ui, sans-serif; text-align: center; text-shadow: 0 2px 6px #000; pointer-events: none; }
      #banner p { margin: 0 0 6px; }
      #banner small { font-size: 15px; font-weight: 400; }
      #banner .big { font-size: 96px; line-height: 1; }
      #banner table { margin: 0 auto 8px; border-collapse: collapse; font-size: 18px; }
      #banner td { padding: 2px 10px; text-align: left; }
      #banner tr.me { color: #ffd65c; }
      #banner i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
      #banner kbd { font: inherit; padding: 0 6px; border: 1px solid #fff8; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="hud" role="status">Connecting…</div>
    <div id="banner" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
