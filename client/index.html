<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rune Kart</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #hud { position: fixed; top: 8px; left: 8px; color: #fff; font: 14px system-ui, sans-serif; text-shadow: 0 1px 2px #000; }
      #banner { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); color: #fff; font: 600 22px system-ui, sans-serif; text-align: center; text-shadow: 0 2px 6px #000; pointer-events: none; }
      #banner p { margin: 0 0 6px; }
      #banner small { font-size: 15px; font-weight: 400; }
      #banner .big { font-size: 96px; line-height: 1; }
      #banner table { margin: 0 auto 8px; border-collapse: collapse; font-size: 18px; }
      #banner td { padding: 2px 10px; text-align: left; }
      #banner tr.me { color: #ffd65c; }
      #banner i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
      #spells { position: fixed; left: 12px; bottom: 12px; display: flex; align-items: flex-end; gap: 8px; font: 12px system-ui, sans-serif; color: #fff; pointer-events: none; }
      #spells .orb { position: relative; width: 84px; height: 84px; border-radius: 50%; overflow: hidden; background: #0a1030cc; border: 3px solid #c9b27a; box-shadow: 0 2px 10px #0008; }
      #spells .orb .fill { position: absolute; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 35% 30%, #8fb4ff, #2546d8 55%, #101f80); transition: height .1s linear; }
      #spells .orb span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 16px; text-shadow: 0 1px 3px #000; }
      #spells .slot { position: relative; width: 64px; padding: 6px 4px; border-radius: 8px; background: #000a; border: 2px solid var(--c); text-align: center; overflow: hidden; }
      #spells .slot b { display: block; font-size: 11px; line-height: 1.2; }
      #spells .slot small { color: #8fb4ff; }
      #spells .slot kbd { position: absolute; top: 2px; left: 4px; font: 700 10px system-ui; opacity: .8; }
      #spells .slot .cd { position: absolute; left: 0; right: 0; bottom: 0; background: #000b; }
      #spells .slot.off { opacity: .45; }
      @media (max-width: 520px) { #spells .slot { width: 52px; } #spells .orb { width: 64px; height: 64px; } }
      #banner kbd { font: inherit; padding: 0 6px; border: 1px solid #fff8; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="hud" role="status">Connecting…</div>
    <div id="banner" aria-live="polite"></div>
    <div id="spells"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
